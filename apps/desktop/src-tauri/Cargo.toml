[package]
name = "game4-desktop"
version = "0.1.0"
description = "Game4∞ desktop application for digital video game preservation"
license = "GPL-3.0-or-later"
repository = "https://github.com/PedroVitor-Dev/Game4-"
edition = "2024"

[lib]
name = "game4_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

rusqlite = { version = "0.41", features = ["bundled"] }
thiserror = "2"
serde_json = { version = "1", features = ["raw_value"] }
ts-rs = "12.0.1"
rfd = "0.17.2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

tempfile = "3"
zip = { version = "9.5.1", default-features = false }
sha1 = "0.10"
url = "2"
librqbit = { version = "=9.1.0", default-features = false, features = ["rust-tls"] }
anyhow = "1"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
