[package]
name = "game4-desktop"
version = "0.1.0"
description = "Game4∞ desktop application for digital video game preservation"
license = "GPL-3.0-or-later"
repository = "https://github.com/PedroVitor-Dev/Game4-"
edition = "2024"

[lib]
name = "game4_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

rusqlite = { version = "0.41", features = ["bundled"] }
thiserror = "2"
serde_json = "1"
ts-rs = "12.0.1"
rfd = "0.17.2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
