[package]
name = "game4-torrent-probe"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "Isolated BitTorrent evaluation tool; not part of the Game4 desktop app"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
librqbit = { version = "=9.1.0", default-features = false, features = ["rust-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
tempfile = "3"
